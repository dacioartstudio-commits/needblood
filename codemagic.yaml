workflows:
  needblood-test-apk:
    name: NeedBlood — Test APK (unsigned)
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Regenerate Gradle wrapper (safety net)
        script: |
          cd android
          gradle wrapper --gradle-version 8.6 || true
          cd ..
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build debug APK (no signing needed — for sideloading/testing only)
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
